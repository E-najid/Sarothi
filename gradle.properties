# Sarothi build configuration.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.enableResourceOptimizations=true

kotlin.code.style=official

# The native runtime (llama.cpp / whisper.cpp / espeak-ng) is fetched by
# scripts/setup_native.sh. Builds that only need to compile Kotlin can skip the
# CMake step with -Psarothi.skipNative=true.
sarothi.skipNative=false
