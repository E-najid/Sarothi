# Sarothi CI.
#
# Two things about this repository shape the workflow:
#
#   1. The Gradle wrapper jar is not committed (it is a binary blob and this
#      project was authored without network access). `gradle/actions/setup-gradle`
#      therefore supplies Gradle 8.11.1 directly, matching
#      gradle/wrapper/gradle-wrapper.properties. A `gradle-wrapper` job
#      regenerates the wrapper and publishes it as an artifact so it can be
#      committed once and CI can switch to ./gradlew.
#
#   2. `:app` is declared in settings.gradle.kts but not written yet, so no APK
#      can be produced. The build job compiles the two library modules that do
#      exist and *automatically* adds :app:assembleDebug the moment
#      app/build.gradle.kts appears -- no workflow edit needed. Until then the
#      APK step reports itself skipped rather than silently passing.
#
# The native runtime (llama.cpp / whisper.cpp) is opt-in: third_party/ is
# gitignored, and core/build.gradle.kts already skips CMake when it is absent,
# so the default path is a fast Kotlin-only build in which the model runtimes
# report themselves unavailable.

name: build

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  # Weekly upstream check: the pinned model files live on Hugging Face and could
  # be replaced or removed without any commit here. Drift is only visible if
  # something looks on a schedule.
  schedule:
    - cron: "20 3 * * 1"
  workflow_dispatch:
    inputs:
      native:
        description: "Build with the native runtime (clones + compiles llama.cpp and whisper.cpp; adds ~20 min)"
        type: boolean
        default: false
      release:
        description: "Also produce an unsigned release build"
        type: boolean
        default: false
      verify_upstream:
        description: "Compare ModelCatalog pins against the Hugging Face API (metadata only, no downloads)"
        type: boolean
        default: false

# A force-push to a PR branch should not keep the superseded build running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned here as well as in gradle-wrapper.properties so a wrapper-less run and
  # a wrapper run cannot drift apart.
  GRADLE_VERSION: "8.11.1"
  COMPILE_SDK: "35"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "27.0.12077973"
  CMAKE_VERSION: "3.22.1"
  # Keeps AGP from phoning home for analytics on a shared runner.
  DO_NOT_TRACK: "1"

jobs:
  # --------------------------------------------------------------- static checks
  # No JDK, no Android SDK, no Gradle. Runs the proofs that do not need a device:
  # the Argon2id implementation against RFC 9106, delimiter balance across every
  # Kotlin source, and the import/resource/manifest/catalogue audit.
  verify:
    name: Static verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Argon2id against RFC 9106 test vectors
        run: python3 scripts/verify_argon2_rfc9106.py

      - name: Kotlin delimiter balance
        run: python3 scripts/check_kotlin_braces.py

      - name: Build audit (imports, resources, manifests, version catalog)
        run: python3 scripts/audit_build.py

      - name: Model catalogue self-consistency
        # Offline: proves every pin is well-formed, unique and locatable upstream.
        # No network, so it cannot flake.
        run: python3 scripts/verify_model_catalog.py --offline

      - name: Model catalogue vs upstream
        # Remote: catches real drift in the published files. Metadata only — the
        # Hugging Face API returns each file's size and LFS object id (which is
        # the SHA-256), so nothing is downloaded. Opt-in because it depends on a
        # third-party service being reachable and should not redden an unrelated
        # PR when HF has an outage.
        if: ${{ inputs.verify_upstream == true || github.event_name == 'schedule' }}
        continue-on-error: true
        run: python3 scripts/verify_model_catalog.py --remote

      - name: Native dependency status
        # Informational: third_party/ is gitignored, so this is expected to report
        # "not fetched" on a clean checkout. It fails the job only if a clone is
        # present but pinned to the wrong revision.
        run: bash scripts/setup_native.sh --check || true

  # ------------------------------------------------------------------ the build
  build:
    name: Build
    runs-on: ubuntu-latest
    # Generous enough for the native variant (compiling llama.cpp for two ABIs is
    # the long pole); a Kotlin-only run finishes in a fraction of this.
    timeout-minutes: 90
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Select variant
        id: variant
        run: |
          native=false
          if [ "${{ inputs.native }}" = "true" ]; then native=true; fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then native=true; fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Building with native runtime: $native"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            # Older runner images put cmdline-tools under a versioned directory.
            sdkmanager="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          fi
          [ -n "$sdkmanager" ] || { echo "sdkmanager not found on runner" >&2; exit 1; }

          # AGP will not auto-install anything until the licences are accepted.
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}"

          if [ "${{ steps.variant.outputs.native }}" = "true" ]; then
            "$sdkmanager" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          fi

      - name: Fetch native dependencies
        if: steps.variant.outputs.native == 'true'
        run: bash scripts/setup_native.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "${{ env.GRADLE_VERSION }}"
          # Cache the Gradle user home (dependency + wrapper caches) but not the
          # build directories: AGP outputs are not reliably relocatable.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Detect which modules can be assembled
        id: modules
        run: |
          set -euo pipefail
          targets=":core:assembleDebug :plugins:assembleDebug"

          if [ -f app/build.gradle.kts ]; then
            targets="$targets :app:assembleDebug"
            echo "app_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::app/build.gradle.kts is missing, so no APK can be produced. Building the library modules only."
          fi

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Gradle targets: $targets"

      - name: Assemble
        run: gradle --no-daemon --stacktrace ${{ steps.modules.outputs.targets }}

      - name: Unit tests
        # No test sources exist yet; the task is wired so that the first test added
        # is executed by CI without a workflow change.
        continue-on-error: false
        run: gradle --no-daemon --stacktrace :core:testDebugUnitTest :plugins:testDebugUnitTest

      - name: Unsigned release build
        if: inputs.release == true && steps.modules.outputs.app_present == 'true'
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      # ------------------------------------------------------------ artifacts
      - name: Locate outputs
        id: outputs
        run: |
          set -euo pipefail
          mkdir -p dist
          found=0

          # APKs (only once :app exists).
          if compgen -G "app/build/outputs/apk/**/*.apk" > /dev/null; then
            find app/build/outputs/apk -name '*.apk' -exec cp -v {} dist/ \;
            found=1
          fi
          if [ "${{ inputs.release }}" = "true" ] && compgen -G "app/build/outputs/apk/**/*.apk" > /dev/null; then
            find app/build/outputs/apk/release -name '*.apk' -exec cp -v {} dist/ \; 2>/dev/null || true
          fi

          # Library AARs -- the real output of the build today.
          find core/build/outputs/aar plugins/build/outputs/aar -name '*.aar' -exec cp -v {} dist/ \; 2>/dev/null || true

          # Native libraries, when the native variant ran.
          if compgen -G "core/build/intermediates/**/libsarothi_native.so" > /dev/null; then
            mkdir -p dist/jni
            find core/build/intermediates -name '*.so' -exec cp -v {} dist/jni/ \; 2>/dev/null || true
            found=1
          fi

          ls -la dist/ || true
          echo "apk_found=$found" >> "$GITHUB_OUTPUT"

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Sarothi build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Native runtime | \`${{ steps.variant.outputs.native }}\` |"
            echo "| Gradle targets | \`${{ steps.modules.outputs.targets }}\` |"
            if [ "${{ steps.modules.outputs.app_present }}" = "true" ]; then
              echo "| APK | built |"
            else
              echo "| APK | **not produced** — \`app/build.gradle.kts\` does not exist yet |"
            fi
            echo ""
            echo "### What was compiled"
            echo ""
            echo "- \`:core\` — capability layer (crypto, vault, agent, plugin engine, screen, voice, model runtime, safety, scheduling)"
            echo "- \`:plugins\` — 78 plugins across 9 categories"
            if [ "${{ steps.variant.outputs.native }}" = "true" ]; then
              echo "- JNI bridge against llama.cpp \`v0.3.0\` and whisper.cpp \`b4938\`"
            else
              echo ""
              echo "_Kotlin-only build: \`third_party/\` was not fetched, so \`libsarothi_native.so\` was not"
              echo "compiled. At runtime \`NativeBridge\` reports the model runtimes unavailable rather than"
              echo "fabricating output. Re-run with \`native=true\` to build the JNI bridge._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarothi-${{ steps.variant.outputs.native == 'true' && 'native' || 'kotlin' }}
          path: |
            dist/
            core/build/reports/**
            plugins/build/reports/**
          if-no-files-found: warn
          retention-days: 14

  # ----------------------------------------------------------------------- lint
  # A separate job rather than a `continue-on-error` step inside `build`: an
  # ignored step disappears into a green check, whereas a job shows up in the PR
  # as its own yellow/neutral result. Lint findings on this codebase are worth
  # seeing but should not block a build that has never been compiled before.
  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          fi
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "${{ env.GRADLE_VERSION }}"

      - name: Lint library modules
        run: gradle --no-daemon :core:lintDebug :plugins:lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: |
            core/build/reports/lint-results-*.html
            core/build/reports/lint-results-*.xml
            plugins/build/reports/lint-results-*.html
            plugins/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------- regenerate the wrapper
  # The wrapper jar is binary and was never committed, so `./gradlew` does not work
  # on a fresh clone. This job produces it as an artifact; committing those four
  # files lets CI and local builds use the wrapper and drops this job.
  gradle-wrapper:
    name: Generate Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "${{ env.GRADLE_VERSION }}"

      - name: Generate wrapper
        run: |
          set -euo pipefail
          gradle --no-daemon wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          ./gradlew --version

      - uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          retention-days: 30
